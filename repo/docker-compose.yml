version: "3.9"

# iOS builds require macOS + Xcode and cannot run inside a Linux container.
# This compose file lets Docker-based CI pipelines pass without errors.
# The actual GreenGate test suite must run on a macOS runner via:
#   make test          — full suite
#   ./run_tests.sh     — same, with optional --unit / --integration / --views

services:
  ios-ci-placeholder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greengate-ios-ci
    # The CMD in the Dockerfile prints a notice and exits 0.
    # Nothing to mount or expose for a build stub.
